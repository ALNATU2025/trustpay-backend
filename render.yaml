# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: trustpay-backend
    runtime: node
    plan: free            # use "starter" or higher for production (free services sleep after 15 minutes)
    region: frankfurt     # closest Render region to West Africa
    buildCommand: npm install --omit=dev --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: MONGODB_URI
        sync: false        # paste your MongoDB Atlas connection string in the Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: CARD_ENCRYPTION_KEY
        sync: false        # 64 hex characters: openssl rand -hex 32
      - key: WEBHOOK_SECRET
        generateValue: true
      # TEST DEPLOYMENT: sandbox moves FAKE money, so anyone who finds this URL can create fake balance.
      # Before real customers: implement the adapters in src/providers, set PROVIDER_MODE=live, OTP_DEBUG=false
      # and remove ALLOW_SANDBOX_IN_PRODUCTION.
      - key: PROVIDER_MODE
        value: sandbox
      - key: ALLOW_SANDBOX_IN_PRODUCTION
        value: "true"
      - key: OTP_DEBUG
        value: "true"      # sandbox testing: returns the SMS code in the response. Set to "false" before PROVIDER_MODE=live.
      # Live money through Monime: see MONIME.md. Leave these empty while PROVIDER_MODE=sandbox.
      - key: MONIME_ACCESS_TOKEN
        sync: false
      - key: MONIME_SPACE_ID
        sync: false
      - key: MONIME_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_URL
        value: https://trustpay-backend-zkiv.onrender.com
      - key: MONIME_FUNDING_ACCOUNT_ID
        sync: false
      - key: SUPER_ADMIN_IDS
        value: 6ad0e47586522f7476ca3775
      - key: CORS_ORIGINS
        value: "*"
      - key: SUPPORT_PHONE
        sync: false
  - type: cron
    name: trustpay-pos-settlement
    runtime: node
    plan: starter
    region: frankfurt
    schedule: "0 16 * * *"   # 16:00 UTC = 4:00 PM Freetown
    buildCommand: npm install --omit=dev --no-audit --no-fund
    startCommand: npm run settle
    envVars:
      - fromService:
          type: web
          name: trustpay-backend
          envVarKey: NODE_ENV
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CARD_ENCRYPTION_KEY
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
  - type: cron
    name: trustpay-reconcile
    runtime: node
    plan: starter
    region: frankfurt
    schedule: "*/5 * * * *"
    buildCommand: npm install --omit=dev --no-audit --no-fund
    startCommand: npm run reconcile
    envVars:
      - fromService:
          type: web
          name: trustpay-backend
          envVarKey: NODE_ENV
      - key: PROVIDER_MODE
        value: sandbox     # set to live together with the web service
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CARD_ENCRYPTION_KEY
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: MONIME_ACCESS_TOKEN
        sync: false
      - key: MONIME_SPACE_ID
        sync: false
